<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity AI Calendar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons (for premium look) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Flatpickr (Date Picker Library) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app-container">
        <!-- カレンダーセクション -->
        <aside class="calendar-section glass-panel">
            <header class="calendar-header">
                <button id="prev-month" class="icon-btn" aria-label="前の月"><i class="ph ph-caret-left"></i></button>
                <h2 id="current-month-year" class="clickable-header" title="月間予定を表示">YYYY年 M月</h2>
                <button id="next-month" class="icon-btn" aria-label="次の月"><i class="ph ph-caret-right"></i></button>
            </header>
            <div class="calendar-days-of-week">
                <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- JSで動的に生成 -->
            </div>
        </aside>

        <!-- 予定一覧セクション -->
        <main class="schedule-section glass-panel">
            <header class="schedule-header">
                <h1 id="selected-date-display">日付を選択してください</h1>
                <button id="open-modal-btn" class="primary-btn" disabled>
                    <i class="ph ph-plus"></i> 新規予定
                </button>
            </header>
            <div class="schedule-content">
                <ul id="schedule-list" class="schedule-list">
                    <li class="empty-state">
                        <i class="ph ph-calendar-blank"></i>
                        <p>予定がありません</p>
                    </li>
                </ul>
            </div>
        </main>
    </div>

    <!-- 予定登録モーダル -->
    <div id="schedule-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">新規予定の登録</h3>
                <button id="close-modal-btn" class="icon-btn"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="schedule-title">予定のタイトル</label>
                    <input type="text" id="schedule-title" placeholder="例: クライアントとのミーティング">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="schedule-start-date">開始日</label>
                        <input type="text" id="schedule-start-date" placeholder="日付を選択">
                    </div>
                    <div class="form-group">
                        <label for="schedule-end-date">終了日</label>
                        <input type="text" id="schedule-end-date" placeholder="日付を選択">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="schedule-time">時間</label>
                        <input type="time" id="schedule-time">
                    </div>
                    <div class="form-group">
                        <label for="schedule-remind">リマインド</label>
                        <select id="schedule-remind">
                            <option value="none">なし</option>
                            <option value="10m">10分前</option>
                            <option value="30m">30分前</option>
                            <option value="1h">1時間前</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="schedule-todo">やること (AIが実行プランを生成します)</label>
                    <textarea id="schedule-todo" rows="3" placeholder="例: 提案書の作成、資料の印刷"></textarea>
                </div>
                
                <div class="ai-action-section">
                    <button id="generate-ai-plan-btn" class="secondary-btn">
                        <i class="ph ph-sparkle"></i> AIでアクションプランを生成
                    </button>
                    <div id="ai-plan-output" class="ai-output hidden">
                        <!-- AI出力がここに表示される -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-btn" class="outline-btn">キャンセル</button>
                <button id="save-btn" class="primary-btn">保存</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
